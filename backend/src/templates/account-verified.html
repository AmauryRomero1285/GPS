<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Cuenta verificada — locfar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f9fafb;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: #0f172a;
        padding: 24px;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: #ffffff;
        border: 2px solid #000000;
        border-radius: 16px;
        padding: 40px 32px;
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
        text-decoration: none;
        color: inherit;
      }
      .brand img {
        width: 36px;
        height: 36px;
        border-radius: 8px;
      }
      .brand strong {
        font-size: 18px;
        letter-spacing: -0.5px;
      }
      .icon-badge {
        width: 64px;
        height: 64px;
        border: 2px solid #000000;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #ffffff;
        margin-bottom: 20px;
      }
      .icon-badge .material-symbols-outlined {
        font-size: 36px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.04em;
        margin: 0 0 10px 0;
      }
      p {
        color: #4b5563;
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 28px 0;
      }
      .instructions {
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 13px;
        color: #374151;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
      }
      .instructions .material-symbols-outlined {
        font-size: 20px;
        color: #000000;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-badge">
        <span class="material-symbols-outlined">check_circle</span>
      </div>

      <h1>¡Cuenta verificada!</h1>
      <p>
        Tu dirección de correo electrónico ha sido confirmada con éxito. Tu cuenta ya está lista para usarse.
      </p>

      <div class="instructions">
        <span class="material-symbols-outlined">smartphone</span>
        <span>Ya puedes regresar a la aplicación de <strong>locfar</strong> en tu dispositivo móvil e iniciar sesión.</span>
      </div>
    </div>
  </body>
</html>
