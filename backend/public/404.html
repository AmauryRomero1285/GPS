<!doctype html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

      h1 { margin: 0; font-size: clamp(64px, 18vw, 130px); line-height: .9; letter-spacing: -.09em; }
      .message { margin: 25px 0; color: #333; font-size: 16px; letter-spacing: normal; line-height: 1.55; text-transform: none; }
      a { display: inline-block; padding: 13px 18px; background: #000; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; }
      a:hover { background: #333; }
    </style>
  </head>
  <body>
    <main>
      <p>locfar</p>
